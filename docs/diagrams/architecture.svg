<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc">
<title id="title">How SlackKB works</title>
<desc id="desc">Three flows on AWS. Capture: /bnote is verified, stored in DynamoDB and acked, then an SQS worker writes the note to S3 with a Titan vector; after 3 failed tries a DLQ notifies the user. Severity: a button opens a modal. Questions: @slackkb questions go through SQS, retrieve notes, and Bedrock answers in thread.</desc>
<style>
:root, svg {
  --bg:#fbfaf7; --card:#ffffff; --ink:#1f2328; --muted:#59636e; --line:#8c959f; --border:#d0d7de;
  --tok:#d97706; --pass:#1a7f37; --fail:#cf222e; --warn:#9a6700; --acc:#4f46e5;
  --slack:#7c3aed; --lam:#c2410c; --store:#1d4ed8; --q:#0f766e;
}
@media (prefers-color-scheme: dark) {
  :root, svg {
    --bg:#0d1117; --card:#161b22; --ink:#e6edf3; --muted:#9198a1; --line:#6e7681; --border:#30363d;
    --tok:#f59e0b; --pass:#3fb950; --fail:#f85149; --warn:#d29922; --acc:#818cf8;
    --slack:#a78bfa; --lam:#fb923c; --store:#60a5fa; --q:#2dd4bf;
  }
}
text { font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; fill:var(--ink); }
.bg { fill:var(--bg); }
.box { fill:var(--card); stroke:var(--border); stroke-width:1.2; }
.t { font-size:14px; font-weight:600; }
.s { font-size:11px; fill:var(--muted); }
.lbl { font-size:10.5px; fill:var(--muted); font-style:italic; }
.cap { font-size:10.5px; font-weight:700; letter-spacing:.12em; fill:var(--muted); }
.ln { fill:none; stroke:var(--line); stroke-width:1.4; }
.flow { fill:none; stroke:var(--tok); stroke-width:1.6; stroke-dasharray:3 9; opacity:.55;
        animation:dash 1.2s linear infinite; }
.halo { fill:none; stroke:var(--bg); stroke-width:6; }
.ah { fill:var(--line); }
.tok { fill:var(--tok); }
.glow { fill:var(--tok); opacity:.25; }
@keyframes dash { to { stroke-dashoffset:-12; } }
@media (prefers-reduced-motion: reduce) {
  .flow, .tok, .glow, .hl { display:none; }
  .badge { display:none; }
}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1000" height="560" rx="14"/>

<text class="cap" x="20" y="58">CAPTURE</text>
<text class="cap" x="20" y="338">SEVERITY</text>
<text class="cap" x="20" y="443">QUESTIONS</text>
<text class="cap" x="980" y="58" text-anchor="end">SAM STACK · 6 LAMBDAS</text>
<path class="ln" d="M165,100 L205,100" marker-end="url(#ah)"/>
<path class="flow" d="M165,100 L205,100"/>
<path class="ln" d="M355,100 L395,100" marker-end="url(#ah)"/>
<path class="flow" d="M355,100 L395,100"/>
<path class="ln" d="M545,100 L585,100" marker-end="url(#ah)"/>
<path class="flow" d="M545,100 L585,100"/>
