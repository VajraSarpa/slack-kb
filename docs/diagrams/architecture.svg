<path class="flow" d="M755,185 L795,185"/>
<path class="ln" d="M470.0,212.0 L470.0,243.0" marker-end="url(#ah)" style="stroke:var(--fail)"/>
<path class="ln" d="M545,270 L585,270" marker-end="url(#ah)" style="stroke:var(--fail)"/>
<path class="ln" d="M755,270 L795,270" marker-end="url(#ah)" style="stroke:var(--fail)"/>
<path class="ln" d="M165,380 L205,380" marker-end="url(#ah)"/>
<path class="flow" d="M165,380 L205,380"/>
<path class="ln" d="M355,380 L395,380" marker-end="url(#ah)"/>
<path class="flow" d="M355,380 L395,380"/>
