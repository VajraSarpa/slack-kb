<path class="flow" d="M755,485 L795,485"/>
<text class="lbl" x="478.0" y="231.5">after 3 tries</text>
<text class="lbl" x="565.0" y="92" text-anchor="middle">ack</text>
<rect class="box" x="20" y="73.0" width="145" height="54" rx="10"/>
<rect x="20" y="81.0" width="4" height="38" rx="2" style="fill:var(--slack)"/>
<text class="t" x="92.5" y="97.0" text-anchor="middle" style="font-size:13.5px">/bnote</text>
<text class="s" x="92.5" y="113.0" text-anchor="middle">Slack command</text>
<rect class="box" x="205" y="73.0" width="150" height="54" rx="10"/>
<rect x="205" y="81.0" width="4" height="38" rx="2" style="fill:var(--lam)"/>
<text class="t" x="280.0" y="97.0" text-anchor="middle" style="font-size:13.5px">capture λ</text>
<text class="s" x="280.0" y="113.0" text-anchor="middle">signature checked first</text>
<rect class="box" x="395" y="73.0" width="150" height="54" rx="10"/>
<rect x="395" y="81.0" width="4" height="38" rx="2" style="fill:var(--store)"/>
<text class="t" x="470.0" y="97.0" text-anchor="middle" style="font-size:13.5px">DynamoDB</text>
<text class="s" x="470.0" y="113.0" text-anchor="middle">note · CAPTURED</text>
<rect class="box" x="585" y="73.0" width="170" height="54" rx="10"/>
<rect x="585" y="81.0" width="4" height="38" rx="2" style="fill:var(--slack)"/>
<text class="t" x="670.0" y="97.0" text-anchor="middle" style="font-size:13.5px">ack + button</text>
<text class="s" x="670.0" y="113.0" text-anchor="middle">&quot;Set severity&quot;</text>
<rect class="box" x="395" y="158.0" width="150" height="54" rx="10"/>
<rect x="395" y="166.0" width="4" height="38" rx="2" style="fill:var(--q)"/>
<text class="t" x="470.0" y="182.0" text-anchor="middle" style="font-size:13.5px">SQS capture</text>
<text class="s" x="470.0" y="198.0" text-anchor="middle">queue</text>
<rect class="box" x="585" y="158.0" width="170" height="54" rx="10"/>
<rect x="585" y="166.0" width="4" height="38" rx="2" style="fill:var(--lam)"/>
<text class="t" x="670.0" y="182.0" text-anchor="middle" style="font-size:13.5px">worker λ</text>
<text class="s" x="670.0" y="198.0" text-anchor="middle">CAPTURED → ROUTED</text>
<rect class="box" x="795" y="158.0" width="185" height="54" rx="27" style="stroke:var(--pass)"/>
<text class="t" x="887.5" y="182.0" text-anchor="middle" style="font-size:13.5px">S3 note + vector</text>
<text class="s" x="887.5" y="198.0" text-anchor="middle">OKF markdown · Titan</text>
<rect class="box" x="395" y="243.0" width="150" height="54" rx="10"/>
<rect x="395" y="251.0" width="4" height="38" rx="2" style="fill:var(--q)"/>
<text class="t" x="470.0" y="267.0" text-anchor="middle" style="font-size:13.5px">DLQ</text>
<text class="s" x="470.0" y="283.0" text-anchor="middle">dead-letter queue</text>
<rect class="box" x="585" y="243.0" width="170" height="54" rx="10"/>
<rect x="585" y="251.0" width="4" height="38" rx="2" style="fill:var(--lam)"/>
<text class="t" x="670.0" y="267.0" text-anchor="middle" style="font-size:13.5px">notify λ</text>
<text class="s" x="670.0" y="283.0" text-anchor="middle">marks FAILED</text>
<rect class="box" x="795" y="243.0" width="185" height="54" rx="27" style="stroke:var(--fail)"/>
<text class="t" x="887.5" y="267.0" text-anchor="middle" style="font-size:13.5px">private notice</text>
<text class="s" x="887.5" y="283.0" text-anchor="middle">the user is told</text>
<rect class="box" x="20" y="353.0" width="145" height="54" rx="10"/>
<rect x="20" y="361.0" width="4" height="38" rx="2" style="fill:var(--slack)"/>
<text class="t" x="92.5" y="377.0" text-anchor="middle" style="font-size:13.5px">button click</text>
<text class="s" x="92.5" y="393.0" text-anchor="middle">Slack interaction</text>
<rect class="box" x="205" y="353.0" width="150" height="54" rx="10"/>
<rect x="205" y="361.0" width="4" height="38" rx="2" style="fill:var(--lam)"/>
<text class="t" x="280.0" y="377.0" text-anchor="middle" style="font-size:13.5px">modal λ</text>
<text class="s" x="280.0" y="393.0" text-anchor="middle">views.open · submit</text>
<rect class="box" x="395" y="353.0" width="150" height="54" rx="10"/>
<rect x="395" y="361.0" width="4" height="38" rx="2" style="fill:var(--store)"/>
<text class="t" x="470.0" y="377.0" text-anchor="middle" style="font-size:13.5px">DynamoDB</text>
<text class="s" x="470.0" y="393.0" text-anchor="middle">severity set</text>
<rect class="box" x="585" y="353.0" width="170" height="54" rx="27" style="stroke:var(--pass)"/>
<text class="t" x="670.0" y="377.0" text-anchor="middle" style="font-size:13.5px">modal closes</text>
<text class="s" x="670.0" y="393.0" text-anchor="middle">or shows a field error</text>
<rect class="box" x="20" y="458.0" width="145" height="54" rx="10"/>
<rect x="20" y="466.0" width="4" height="38" rx="2" style="fill:var(--slack)"/>
<text class="t" x="92.5" y="482.0" text-anchor="middle" style="font-size:13.5px">@slackkb</text>
<text class="s" x="92.5" y="498.0" text-anchor="middle">question in Slack</text>
<rect class="box" x="205" y="458.0" width="150" height="54" rx="10"/>
<rect x="205" y="466.0" width="4" height="38" rx="2" style="fill:var(--lam)"/>
<text class="t" x="280.0" y="482.0" text-anchor="middle" style="font-size:13.5px">events λ</text>
<text class="s" x="280.0" y="498.0" text-anchor="middle">Events API</text>
<rect class="box" x="395" y="458.0" width="150" height="54" rx="10"/>
<rect x="395" y="466.0" width="4" height="38" rx="2" style="fill:var(--q)"/>
<text class="t" x="470.0" y="482.0" text-anchor="middle" style="font-size:13.5px">SQS question</text>
<text class="s" x="470.0" y="498.0" text-anchor="middle">queue</text>
<rect class="box" x="585" y="458.0" width="170" height="54" rx="10"/>
<rect x="585" y="466.0" width="4" height="38" rx="2" style="fill:var(--lam)"/>
<text class="t" x="670.0" y="482.0" text-anchor="middle" style="font-size:13.5px">answer λ</text>
<text class="s" x="670.0" y="498.0" text-anchor="middle">embed → retrieve → Bedrock</text>
<rect class="box" x="795" y="458.0" width="185" height="54" rx="27" style="stroke:var(--pass)"/>
<text class="t" x="887.5" y="482.0" text-anchor="middle" style="font-size:13.5px">reply in thread</text>
<text class="s" x="887.5" y="498.0" text-anchor="middle">cites note ids</text>
<rect x="20" y="525" width="10" height="10" rx="3" style="fill:var(--slack)"/>
<text class="s" x="36" y="534">Slack</text>
<rect x="82.0" y="525" width="10" height="10" rx="3" style="fill:var(--lam)"/>
<text class="s" x="98.0" y="534">Lambda</text>
<rect x="150.4" y="525" width="10" height="10" rx="3" style="fill:var(--store)"/>
<text class="s" x="166.4" y="534">DynamoDB / S3</text>
<rect x="263.6" y="525" width="10" height="10" rx="3" style="fill:var(--q)"/>
<text class="s" x="279.6" y="534">SQS</text>
<rect x="312.8" y="525" width="10" height="10" rx="3" style="fill:var(--pass)"/>
<text class="s" x="328.8" y="534">result</text>
