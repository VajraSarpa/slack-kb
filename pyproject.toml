[project]
name = "slackkb"
version = "0.1.0"
description = "Slack incident-note knowledge base on AWS (Lambda, SQS, DynamoDB, S3, Bedrock), built test-first"
readme = "README.md"
license = "MIT"
authors = [
    { name = "VajraSarpa", email = "vajrasarpa@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.112",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "slack-bolt>=1.30.0",
]

[project.scripts]
slackkb = "slackkb:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "cfn-lint>=1.60.0",
    "moto[dynamodb,s3,sqs]>=5.2.4",
    "pytest>=9.1.1",
    "pytest-socket>=0.8.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
addopts = "-q --disable-socket"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
